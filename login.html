<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, 'Inter', sans-serif;
            background: linear-gradient(180deg, #1565c0 0%, #1976d2 55%, #2196f3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 120px;
            padding-bottom: 60px;
            position: relative;
            overflow-x: hidden;
        }

        .mountain-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
            width: 575px;
            min-height: 668px;
            display: flex;
            flex-direction: column;
        }

        .card-body {
            padding: 35px 58px 32px 58px;
            flex: 1;
        }

        .logo {
            width: 175px;
            height: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            border-radius: 4px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: #222;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        h1 {
            font-size: 21px;
            font-weight: bold;
            color: #222;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 16px;
            font-weight: 400;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 49px;
            padding: 0 14px;
            border: 1px solid #bbb;
            border-radius: 3px;
            font-size: 16px;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            background: #fff;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #1565c0;
            box-shadow: 0 0 0 2px rgba(21, 101, 192, 0.15);
        }

        .password-wrapper {
            position: relative;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .show-password:hover {
            color: #1565c0;
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 24px;
        }

        button[type="submit"] {
            background: #1565c0;
            color: #fff;
            border: none;
            border-radius: 3px;
            width: 128px;
            height: 44px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            flex-shrink: 0;
        }

        button[type="submit"]:hover {
            background: #1976d2;
        }

        button[type="submit"]:active {
            background: #0d47a1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #1565c0;
            flex-shrink: 0;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 15px;
            color: #444;
            font-weight: 400;
        }

        .card-footer {
            background: #f2f2f2;
            border-top: 1px solid #ddd;
            padding: 18px 58px 16px 58px;
            height: 128px;
            border-radius: 0 0 3px 3px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .footer-label {
            font-size: 15px;
            color: #444;
            margin-bottom: 8px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .footer-select {
            width: 100%;
            height: 36px;
            border: 1px solid #bbb;
            border-radius: 3px;
            font-size: 14px;
            padding: 0 10px;
            background: #fff;
            color: #333;
            font-family: Arial, Helvetica, sans-serif;
            cursor: pointer;
        }

        .help-icon {
            position: absolute;
            bottom: 14px;
            right: 16px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid #888;
            color: #666;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
        }

        .help-icon:hover {
            border-color: #1565c0;
            color: #1565c0;
        }

        @media (max-width: 620px) {
            body {
                padding-top: 40px;
            }

            .card {
                width: 100%;
                min-height: unset;
                margin: 0 12px;
            }

            .card-body {
                padding: 28px 28px 24px 28px;
            }

            .card-footer {
                padding: 16px 28px;
            }

            .form-actions {
                flex-wrap: wrap;
                gap: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Mountain landscape background -->
    <svg class="mountain-bg" viewBox="0 0 1440 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M0,180 L0,110 L100,75 L200,100 L320,50 L440,90 L560,35 L680,80 L800,45 L920,75 L1040,28 L1160,65 L1280,95 L1380,55 L1440,72 L1440,180 Z" fill="rgba(255,255,255,0.06)"/>
        <path d="M0,180 L0,140 L160,108 L320,130 L480,98 L640,122 L800,88 L960,115 L1120,95 L1280,118 L1440,102 L1440,180 Z" fill="rgba(255,255,255,0.04)"/>
        <path d="M0,180 L0,160 L240,148 L480,158 L720,144 L960,155 L1200,146 L1440,152 L1440,180 Z" fill="rgba(255,255,255,0.03)"/>
    </svg>

    <div class="card">
        <div class="card-body">
            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon"></div>
                <span class="logo-text">MyApp</span>
            </div>

            <!-- Heading -->
            <h1>Sign In</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">User Name</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="show-password" onclick="togglePassword()">Show</button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit">Sign In</button>
                    <div class="checkbox-group">
                        <input type="checkbox" id="staySignedIn" name="staySignedIn">
                        <label for="staySignedIn">Stay Signed In</label>
                    </div>
                </div>
            </form>
        </div>

        <!-- Gray footer section -->
        <div class="card-footer">
            <div class="footer-label">Web App Version</div>
            <select class="footer-select" id="appVersion" name="appVersion">
                <option value="v1">Version 1.0</option>
                <option value="v2">Version 2.0</option>
                <option value="v3">Version 3.0</option>
            </select>
            <div class="help-icon" title="Help">?</div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const button = document.querySelector('.show-password');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                button.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                button.textContent = 'Show';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const staySignedIn = document.getElementById('staySignedIn').checked;

            if (username && password) {
                alert(`Login attempt:\nUsername: ${username}\nStay signed in: ${staySignedIn}`);
            }
        });
    </script>
</body>
</html>
