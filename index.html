<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e88e5 0%, #0d47a1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 60px 40px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .logo-icon {
            display: inline-block;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            margin-right: 10px;
            border-radius: 4px;
            vertical-align: middle;
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #1e88e5;
            box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .show-password:hover {
            color: #1e88e5;
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 25px 0;
            gap: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1e88e5;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            font-weight: 400;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #0277bd 0%, #01579b 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #0288d1 0%, #0277bd 100%);
            box-shadow: 0 4px 12px rgba(2, 119, 189, 0.4);
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        .warning-banner {
            background-color: #d32f2f;
            color: white;
            padding: 15px;
            margin-top: 30px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .warning-banner a {
            color: #ffeb3b;
            text-decoration: none;
        }

        .warning-banner a:hover {
            text-decoration: underline;
        }

        .footer {
            color: #888;
            font-size: 11px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 24px;
            }

            .form-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="logo-icon"></span>
            MyApp
        </div>

        <h1>Sign in</h1>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="show-password" onclick="togglePassword()">Show</button>
                </div>
            </div>

            <div class="form-actions">
                <div class="checkbox-group">
                    <input type="checkbox" id="staySignedIn" name="staySignedIn">
                    <label for="staySignedIn">Stay signed in</label>
                </div>
                <button type="submit">Sign In</button>
            </div>
        </form>

        <div class="warning-banner">
            ⚠️ Be aware that phishing emails may appear to come from us. We will NEVER ask you for personal information via email. If you receive an email like this, please delete it or mark as spam. For more information, visit our security page.
        </div>

        <div class="footer">
            Copyright © 2025. All rights reserved.
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const button = document.querySelector('.show-password');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                button.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                button.textContent = 'Show';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const staySignedIn = document.getElementById('staySignedIn').checked;

            // Example validation
            if (username && password) {
                alert(`Login attempt:\nUsername: ${username}\nStay signed in: ${staySignedIn}`);
                // Here you would typically send this to your backend
            }
        });
    </script>
</body>
</html>
